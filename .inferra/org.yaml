# The one Inferra file for this repo. Inferra's GitHub App reads it on every
# push to main and makes the org match it.
version: 1

spaces:
  prod:
    branch: main          # a push to main deploys to prod
  preview:
    branches: "*"         # every other branch gets its own preview copy

apps:
  api:
    path: api/            # built with buildpacks, no Dockerfile
    port: 3000
    cpu: "0.5"
    memory: 512Mi
    replicas: { min: 1, max: 2 }
    health: /healthz
  worker:
    path: worker/
    command: node worker.js   # background process: no port, no URL
    memory: 256Mi
    replicas: { min: 1, max: 1 }

# Env vars and secrets live in GitHub: Settings > Environments > prod|preview.
