# Sends this repo's GitHub Environment variables and the secrets listed below
# to the Inferra space of the same name (main), on every push to main
# or a manual run. Only the secrets named here leave GitHub.
name: inferra-env
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    permissions:
      id-token: write   # proves to Inferra which repo this is; no stored token
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        space: [main]
    environment: ${{ matrix.space }}
    steps:
      - uses: inferra-ai/sync-env@9f276f3cbc9dde9eaebc619950ab11b4ed074c03 # v1.0.7
        with:
          space: ${{ matrix.space }}
          api-url: https://api.dev.inferralab.dev   # preview platform
          variables: ${{ toJSON(vars) }}
          secrets: |
            {
              "GREETING_SECRET": ${{ toJSON(secrets.GREETING_SECRET) }}
            }
